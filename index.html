<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Control de Asistencia</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="login-contenedor">
    <section class="card login-card">
      <h1>Control de Asistencia</h1>
      <p>Ingresa con tu cuenta corporativa</p>

      <form id="formLogin">
        <div class="form-grupo">
          <label for="correo">Correo</label>
          <input type="email" id="correo" placeholder="usuario@empresa.com">
        </div>
        <div class="form-grupo">
          <label for="clave">Contraseña</label>
          <input type="password" id="clave" placeholder="••••••">
        </div>

        <div id="mensajeError" class="mensaje-error"></div>

        <button type="submit" class="btn btn-primario btn-bloque">Ingresar</button>
      </form>

      <div class="login-demo">
        <strong>Usuarios de prueba (clave: 123456)</strong><br>
        empleado@empresa.com<br>
        supervisor@empresa.com<br>
        admin@empresa.com
      </div>
    </section>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
