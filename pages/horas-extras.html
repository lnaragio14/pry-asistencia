<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horas extras | Control de Asistencia</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-roles="EMPLEADO">
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-logo">Control de Asistencia</div>
      <nav id="menu"></nav>
      <button id="btnSalir" class="btn btn-secundario">Cerrar sesión</button>
    </aside>

    <div class="contenido">
      <header class="topbar">
        <h2>Horas extras</h2>
        <div class="usuario-info">
          <span id="nombreUsuario"></span>
          <span id="rolUsuario" class="rol-tag"></span>
        </div>
      </header>

      <main class="pagina">
        <section class="card" style="margin-bottom:24px">
          <h3>Nueva solicitud</h3>

          <form id="formSolicitud">
            <div class="form-fila">
              <div class="form-grupo">
                <label for="fecha">Fecha</label>
                <input type="date" id="fecha">
              </div>
              <div class="form-grupo">
                <label for="inicio">Hora inicio</label>
                <input type="time" id="inicio">
              </div>
              <div class="form-grupo">
                <label for="fin">Hora fin</label>
                <input type="time" id="fin">
              </div>
            </div>

            <div class="horas-calculadas">
              Total solicitado: <strong id="totalHoras">0 h</strong>
            </div>

            <div class="form-grupo">
              <label for="motivo">Motivo</label>
              <textarea id="motivo" placeholder="Describe la actividad realizada (mínimo 10 caracteres)"></textarea>
            </div>

            <button type="submit" class="btn btn-primario">Enviar solicitud</button>
            <div id="alerta" class="alerta"></div>
          </form>
        </section>

        <section class="card">
          <h3>Mis solicitudes</h3>
          <div class="tabla-contenedor">
            <table class="tabla">
              <thead>
                <tr><th>Fecha</th><th>Horario</th><th>Horas</th><th>Motivo</th><th>Estado</th></tr>
              </thead>
              <tbody id="tablaSolicitudes"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="../js/datos.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/horas-extras.js"></script>
</body>
</html>
