<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Integraciones | Control de Asistencia</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-roles="ADMINISTRADOR">
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-logo">Control de Asistencia</div>
      <nav id="menu"></nav>
      <button id="btnSalir" class="btn btn-secundario">Cerrar sesión</button>
    </aside>

    <div class="contenido">
      <header class="topbar">
        <h2>Integraciones</h2>
        <div class="usuario-info">
          <span id="nombreUsuario"></span>
          <span id="rolUsuario" class="rol-tag"></span>
        </div>
      </header>

      <main class="pagina">
        <div class="encabezado-seccion">
          <h3>Orígenes de marcación</h3>
          <button id="btnNuevo" class="btn btn-primario">+ Nuevo origen</button>
        </div>

        <div id="alerta" class="alerta" style="margin-bottom:16px"></div>

        <section id="listaOrigenes" class="grid-2"></section>

        <section class="card">
          <h3>Marcaciones recibidas de orígenes externos</h3>
          <div class="tabla-contenedor">
            <table class="tabla">
              <thead>
                <tr><th>Empleado</th><th>Fecha</th><th>Hora</th><th>Tipo</th><th>Origen</th></tr>
              </thead>
              <tbody id="tablaExternas"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- Modal: configurar origen -->
  <div id="modalConfig" class="modal-fondo">
    <div class="card modal modal-grande">
      <h3 id="tituloConfig">Nuevo origen</h3>
      <p>Las credenciales se muestran enmascaradas en el listado.</p>

      <div class="form-fila">
        <div class="form-grupo">
          <label for="cfgNombre">Nombre (identificador) *</label>
          <input type="text" id="cfgNombre" placeholder="Ej. ERP_SEDE_NORTE">
        </div>
        <div class="form-grupo">
          <label for="cfgTipo">Dirección *</label>
          <select id="cfgTipo">
            <option value="ENTRANTE">Entrante (el externo nos envía)</option>
            <option value="SALIENTE">Saliente (consultamos al externo)</option>
          </select>
        </div>
      </div>

      <div class="form-grupo">
        <label for="cfgDescripcion">Descripción *</label>
        <input type="text" id="cfgDescripcion">
      </div>

      <div id="cfgAyuda" class="ayuda"></div>

      <div class="form-grupo">
        <label for="cfgEndpoint">Endpoint / ruta</label>
        <input type="text" id="cfgEndpoint" placeholder="https://api.proveedor.com/v1/marcaciones">
      </div>

      <div class="form-grupo">
        <label for="cfgApiKey">API key</label>
        <div class="campo-con-boton">
          <input type="text" id="cfgApiKey">
          <button type="button" id="btnGenerar" class="btn btn-secundario">Generar clave</button>
          <button type="button" id="btnMostrar" class="btn btn-secundario">Mostrar</button>
        </div>
      </div>

      <div id="errorConfig" class="mensaje-error"></div>
      <div class="modal-botones">
        <button id="btnCancelarConfig" class="btn btn-secundario">Cancelar</button>
        <button id="btnGuardarConfig" class="btn btn-primario">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Modal: simular petición del sistema externo -->
  <div id="modalSimular" class="modal-fondo">
    <div class="card modal">
      <h3>Simular envío a la API</h3>
      <p id="simDetalle"></p>

      <div class="form-grupo">
        <label for="simEmpleado">Empleado</label>
        <select id="simEmpleado"></select>
      </div>
      <div class="form-grupo">
        <label for="simTipo">Tipo de marcación</label>
        <select id="simTipo">
          <option value="ENTRADA">Entrada</option>
          <option value="SALIDA">Salida</option>
        </select>
      </div>
      <div class="form-grupo">
        <label for="simClave">API key enviada en la petición</label>
        <input type="text" id="simClave">
      </div>

      <div id="errorSimular" class="mensaje-error"></div>
      <div class="modal-botones">
        <button id="btnCancelarSimular" class="btn btn-secundario">Cancelar</button>
        <button id="btnEnviarSimular" class="btn btn-primario">Enviar petición</button>
      </div>
    </div>
  </div>

  <script src="../js/datos.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/integraciones.js"></script>
</body>
</html>
